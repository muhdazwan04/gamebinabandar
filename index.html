#intro .moon{position:absolute;right:12%;top:9%;width:clamp(36px,8vw,64px);aspect-ratio:1;border-radius:50%;background:#fff8dc;box-shadow:0 0 30px 8px rgba(255,248,220,.35);opacity:0;animation:ifade 1.6s .3s forwards}

#intro .bar{position:absolute;left:50%;bottom:7%;transform:translateX(-50%);width:min(340px,76vw);height:9px;border-radius:9px;background:rgba(255,255,255,.12);overflow:hidden;pointer-events:none}
#intro .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ac),var(--gold));animation:ibar 40s linear forwards}

<script>
(function(){const el=document.getElementById('intro');if(!el)return;const $q=c=>el.querySelector(c),st=$q('.stars'),ct=$q('.city');
for(let i=0;i<45;i++){const d=document.createElement('i');d.className='star';d.style.left=Math.random()*100+'%';d.style.top=Math.random()*55+'%';d.style.animationDelay=(Math.random()*2.4)+'s';st.appendChild(d)}
const n=Math.max(9,Math.min(24,Math.floor(innerWidth/40)));for(let i=0;i<n;i++){const b=document.createElement('div');b.className='bd';b.style.height=(28+Math.random()*72)+'%';b.style.animationDelay=(Math.random()*1.8)+'s';ct.appendChild(b)}
const L=(box,txt,d0)=>{[...txt].forEach((c,i)=>{const s=document.createElement('span');s.textContent=c===' '?'\u00a0':c;s.style.animationDelay=(d0+i*.09)+'s';box.appendChild(s)})};
L($q('.t1'),'IWAN',1.2);L($q('.t2'),'NEW TOWN',1.7);
const rd=window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches,DUR=rd?1200:40000,rd0=$q('.road');
for(let i=0;i<6;i++){const c=document.createElement('i');c.className='car'+(i%2?' r':'');c.style.animationDelay=(i*1.1)+'s';c.style.animationDuration=(5+i%3)+'s';rd0.appendChild(c)}
const MS=['Menyediakan peta bandar…','Membancuh simen & besi…','Membina jalan raya…','Memasang talian elektrik…','Menanam pokok di taman…','Memanggil rakyat berpindah masuk…','Melantik Presiden…','Hampir siap…'],pc=$q('.pct'),mg=$q('.msg'),t0=Date.now();
let gone=false;const tk=setInterval(()=>{const f=Math.min(1,(Date.now()-t0)/DUR);pc.textContent=Math.floor(f*100)+'%';mg.textContent=MS[Math.min(MS.length-1,Math.floor(f*MS.length))];if(f>=1)bye()},120);
function bye(){if(gone)return;gone=true;clearInterval(tk);el.classList.add('out');setTimeout(()=>el.remove(),900)}
el.addEventListener('click',bye)})();
</script>

<script>
let PK='bina_bandar_3d_profile_v1';let PROF={pres:'',country:''},profMode=null;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),title=()=>'Presiden '+(PROF.pres||'');
function loadProf(){try{const d=JSON.parse(localStorage.getItem(PK)||'null');if(d&&d.pres&&d.country){PROF={pres:String(d.pres).slice(0,24),country:String(d.country).slice(0,30)};document.title=PROF.country+' · Bina Bandar 3D';return true}}catch(e){}return false}
